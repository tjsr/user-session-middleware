name: Build user-session-middleware
run-name: Build user-session-middleware build on ${{ github.ref_name }}.
on: [push]
jobs:
  build-user-session-middleware:
    name: Node ${{ matrix.node }} / Express 5 (${{ matrix.support }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # Setup .npmrc file to publish to GitHub Packages
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v5
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        # todo - change this so we are less restrictive on package-lock changes
        key: ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.node }}-build-
          ${{ runner.os }}-

    - name: Install latest npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - name: Regenerate published type dependency lock (temporary maintenance step)
      run: npm install --package-lock-only --ignore-scripts --strict-peer-deps
    - run: npm ci --strict-peer-deps

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: List the state of node modules
      continue-on-error: true
      run: npm list

    # Mock factories must use the same Express types as the selected runtime.
    - name: Verify Express compatibility target
      env:
        EXPRESS_VERSION: '5.3.0'
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict');
        const { createRequire } = require('node:module');
        assert.equal(require('express/package.json').version, process.env.EXPRESS_VERSION);
        const expectedTypes = '5.0.6';
        assert.equal(require('@types/express/package.json').version, expectedTypes);
        const mockRequire = createRequire(require.resolve('vitest-mock-express'));
        assert.equal(mockRequire.resolve('@types/express/package.json'), require.resolve('@types/express/package.json'));
        const path = require('node:path');
        const semver = require('semver');
        const mysqlEntry = require.resolve('@tjsr/mysql-pool-utils');
        const mysqlPackage = require(path.resolve(path.dirname(mysqlEntry), '../../package.json'));
        const mysqlRequire = createRequire(mysqlEntry);
        const driverVersion = mysqlRequire('mysql2/package.json').version;
        assert.equal(mysqlPackage.version, '0.2.2');
        assert.ok(semver.satisfies(driverVersion, mysqlPackage.dependencies.mysql2),
          `mysql2 ${driverVersion} must satisfy ${mysqlPackage.dependencies.mysql2}`);
        NODE

    - run: npm run test
    - name: Lint the error handler implementation
      run: node node_modules/eslint/bin/eslint.js --config eslint.config.mjs src/middleware/sessionErrorHandler.ts src/utils/apiMiddlewareUtils.ts src/utils/apiMiddlewareUtils.test.ts
    - name: Verify release baseline (read only)
      if: matrix.node == 24
      run: node scripts/check-release.cjs

    - run: npm run build

    - name: Run lint at end on all other branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm pack --dry-run
        node scripts/test-package.cjs

  regenerate-dependency-lock:
    name: Commit production type dependency lock (temporary maintenance job)
    if: github.ref == 'refs/heads/fix/express-5-compatibility'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          registry-url: https://npm.pkg.github.com
          scope: '@tjsr'
      - run: npm install --global npm@12.2.1 --registry=https://registry.npmjs.org
      - name: Regenerate strict lock without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --strict-peer-deps
          node <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          for (const name of ['@types/express', '@types/express-session', '@types/express-mysql-session']) {
            assert.ok(lock.packages[''].dependencies[name]);
            assert.ok(!lock.packages['node_modules/' + name].dev);
          }
          assert.equal(process.env.GITHUB_REPOSITORY, 'tjsr/user-session-middleware');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/fix/express-5-compatibility');
          NODE
      - name: Commit only the generated lock to the existing branch
        run: |
          git diff --exit-code -- package.json
          git add -- package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate the production type dependency lock'
          git push origin HEAD:refs/heads/fix/express-5-compatibility
