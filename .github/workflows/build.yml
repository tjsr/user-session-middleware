name: Build user-session-middleware
run-name: Build user-session-middleware build on ${{ github.ref_name }}.
on: [push]
jobs:
  build-user-session-middleware:
    name: Node ${{ matrix.node }} / Express 5 (${{ matrix.support }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # Setup .npmrc file to publish to GitHub Packages
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v5
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        # todo - change this so we are less restrictive on package-lock changes
        key: ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.node }}-build-
          ${{ runner.os }}-

    - name: Install latest npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - name: Regenerate Express 5 public dependency records (temporary maintenance step)
      run: |
        cp package-lock.json "$RUNNER_TEMP/usm-lock-before.json"
        npm install --package-lock-only --ignore-scripts --strict-peer-deps
        if [ '${{ matrix.node }}' = '24' ]; then
          node <<'NODE'
        const assert = require('node:assert/strict');
        const fs = require('node:fs');
        const path = require('node:path');
        const before = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'usm-lock-before.json'))).packages;
        const after = JSON.parse(fs.readFileSync('package-lock.json')).packages;
        const changes = [];
        for (const key of new Set([...Object.keys(before), ...Object.keys(after)])) {
          if (!key || JSON.stringify(before[key]) === JSON.stringify(after[key])) continue;
          const record = after[key] || before[key];
          assert.ok(!key.includes('@tjsr/'), 'Private package records must remain unchanged');
          if (record.resolved) assert.equal(new URL(record.resolved).origin, 'https://registry.npmjs.org', 'Only public npm records may be returned');
          for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
            assert.ok(!Object.keys(record[field] || {}).some(name => name.startsWith('@tjsr/')), 'Private dependency metadata must remain unchanged');
          }
          changes.push({ key, value: after[key] || null });
        }
        const text = Buffer.from(JSON.stringify(changes)).toString('base64');
        for (let offset = 0; offset < text.length; offset += 5000) console.log('PUBLIC_LOCK_DELTA:' + text.slice(offset, offset + 5000));
        NODE
        fi

    - run: npm ci

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: List the state of node modules
      continue-on-error: true
      run: npm list

    # Mock factories must use the same Express types as the selected runtime.
    - name: Verify Express compatibility target
      env:
        EXPRESS_VERSION: '5.3.0'
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict');
        const { createRequire } = require('node:module');
        assert.equal(require('express/package.json').version, process.env.EXPRESS_VERSION);
        const expectedTypes = '5.0.6';
        assert.equal(require('@types/express/package.json').version, expectedTypes);
        const mockRequire = createRequire(require.resolve('vitest-mock-express'));
        assert.equal(mockRequire.resolve('@types/express/package.json'), require.resolve('@types/express/package.json'));
        NODE

    - run: npm run test
    - run: npm run build

    - name: Run lint at end on all other branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm pack --dry-run
        node scripts/test-package.cjs
  