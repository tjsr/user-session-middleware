name: Build user-session-middleware
run-name: Build user-session-middleware build on ${{ github.ref_name }}.
on: [push]
jobs:
  build-user-session-middleware:
    name: Node ${{ matrix.node }} / Express ${{ matrix.express }} (${{ matrix.support }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        express: ['4.21.2', '5.3.0']
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # Setup .npmrc file to publish to GitHub Packages
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v5
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        # todo - change this so we are less restrictive on package-lock changes
        key: ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.node }}-build-
          ${{ runner.os }}-

    - name: Install latest npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - run: npm ci

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: List the state of node modules
      continue-on-error: true
      run: npm list

    - name: Select Express 5 runtime and matching types
      if: matrix.express == '5.3.0'
      run: npm install --no-save --ignore-scripts --strict-peer-deps express@5.3.0 @types/express@5.0.6

    - name: Verify Express compatibility target
      env:
        EXPRESS_VERSION: ${{ matrix.express }}
      run: |
        node -e "const assert = require('node:assert/strict'); assert.equal(require('express/package.json').version, process.env.EXPRESS_VERSION); assert.equal(require('@types/express/package.json').version, process.env.EXPRESS_VERSION.startsWith('5.') ? '5.0.6' : '4.17.25');"

    - run: npm run test
    - run: npm run build

    - name: Run lint at end on all other branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm pack --dry-run
  