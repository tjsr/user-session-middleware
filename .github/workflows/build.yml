name: Build user-session-middleware
run-name: Build user-session-middleware build on ${{ github.ref_name }}.
on: [push]
jobs:
  build-user-session-middleware:
    name: Node ${{ matrix.node }} / Express 5 (${{ matrix.support }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # Setup .npmrc file to publish to GitHub Packages
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v5
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        # todo - change this so we are less restrictive on package-lock changes
        key: ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.node }}-build-
          ${{ runner.os }}-

    - name: Install latest npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - name: Regenerate the dependency lock (temporary maintenance step)
      run: |
        npm install --package-lock-only --ignore-scripts --strict-peer-deps
        node <<'NODE'
        const assert = require('node:assert/strict');
        const lock = require('./package-lock.json');
        assert.equal(lock.packages['node_modules/@tjsr/mysql-pool-utils'].version, '0.2.2');
        for (const record of Object.values(lock.packages)) {
          if (record.resolved && record.resolved.startsWith('https://')) {
            const url = new URL(record.resolved);
            assert.ok(!url.username && !url.password, 'Authenticated URLs must not enter a lockfile');
          }
        }
        console.log('Generated strict dependency lock for mysql-pool-utils 0.2.2.');
        NODE

    - name: Retain generated lock for authenticated download
      if: matrix.node == 24
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: middleware-express5-dependency-lock
        path: package-lock.json
        retention-days: 1
        if-no-files-found: error

    - run: npm ci --strict-peer-deps

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: List the state of node modules
      continue-on-error: true
      run: npm list

    # Mock factories must use the same Express types as the selected runtime.
    - name: Verify Express compatibility target
      env:
        EXPRESS_VERSION: '5.3.0'
      run: |
        node <<'NODE'
        const assert = require('node:assert/strict');
        const { createRequire } = require('node:module');
        assert.equal(require('express/package.json').version, process.env.EXPRESS_VERSION);
        const expectedTypes = '5.0.6';
        assert.equal(require('@types/express/package.json').version, expectedTypes);
        const mockRequire = createRequire(require.resolve('vitest-mock-express'));
        assert.equal(mockRequire.resolve('@types/express/package.json'), require.resolve('@types/express/package.json'));
        NODE

    - run: npm run test
    - name: Verify release baseline (read only)
      if: matrix.node == 24
      run: node scripts/check-release.cjs

    - run: npm run build

    - name: Run lint at end on all other branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm pack --dry-run
        node scripts/test-package.cjs
  