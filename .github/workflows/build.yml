name: Build user-session-middleware
run-name: Build user-session-middleware build on ${{ github.ref_name }}.
on: [push]
jobs:
  build-user-session-middleware:
    name: Node ${{ matrix.node }} / Express 5 (${{ matrix.support }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        include:
          - node: 22
            support: diagnostic
          - node: 24
            support: supported
          - node: 26
            support: supported
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7

    # Setup .npmrc file to publish to GitHub Packages
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        check-latest: true
        registry-url: 'https://npm.pkg.github.com'

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v6
      env:
        cache-name: cache-node-modules
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ~/.npm
        # todo - change this so we are less restrictive on package-lock changes
        key: ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.node }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ matrix.node }}-build-
          ${{ runner.os }}-

    - name: Install latest npm
      run: npm install --global npm@latest --registry=https://registry.npmjs.org

    - run: npm ci --strict-peer-deps

    - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      name: List the state of node modules
      continue-on-error: true
      run: npm list

    - run: npm run test
    - name: Lint middleware and test fixture compatibility
      run: node node_modules/eslint/bin/eslint.js --config eslint.config.mjs src/middleware/sessionErrorHandler.ts src/utils/apiMiddlewareUtils.ts src/utils/apiMiddlewareUtils.test.ts src/middleware/setSessionCookie.ts src/utils/testing/context/session.ts src/utils/testing/apiTestUtils.ts src/utils/testing/supertestUtils.ts
    - name: Verify release baseline (read only)
      if: matrix.node == 24
      run: node scripts/check-release.cjs

    - run: npm run build

    - name: Run lint at end on all other branches
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prod'
      run: |
        npm pack --dry-run
        node scripts/test-package.cjs
