name: Dependabot automation

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build user-session-middleware"]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependabot-automation
  cancel-in-progress: false

jobs:
  dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: tjsr/eslint-config/.github/actions/dependabot@be34adbb7820a57447e9529fc10aec3cb6e43115
        with:
          scope: linter
          workflows: '[".github/workflows/build.yml"]'
          # An existing automation token also lets merges trigger downstream push workflows.
          token: ${{ secrets.TJSR_AUTOMATION_TOKEN || github.token }}
